apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-config
  namespace: his
data:
  SPRING_DATASOURCE_USERNAME: "billing"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"

  # 브라우저 요청을 허용할 출처 목록
  APP_CORS_ALLOWED_ORIGIN_PATTERNS: "http://localhost:3000,http://seoulit.pe.kr:18080,http://seoulit.pe.kr:18090,http://117.16.154.233:18080,http://117.16.154.233:18090"

  # 카카오페이 결제 후 돌아올 주소
  KAKAOPAY_APPROVAL_URL: "http://seoulit.pe.kr:18090/billing/payment/kakaopay/return"
  KAKAOPAY_CANCEL_URL: "http://seoulit.pe.kr:18090/billing/payment/kakaopay/cancel"
  KAKAOPAY_FAIL_URL: "http://seoulit.pe.kr:18090/billing/payment/kakaopay/fail"

 # /api/** 와 /files/** 를 Nginx 가 직접 해당 서비스로 보낸다. 그 외(화면)는 새 프론트(hisfrontend-nginx)로.
    # next.config.ts 의 rewrites() 가 하던 일을 그대로 옮긴 것이다.

    # 쿠버네티스 안의 DNS 서버(kube-dns Service 의 CLUSTER-IP). 아래 proxy_pass 가 "변수"를 써서 요청이 올 때 이름을 찾기 때문에 필요하다.
    # 이 클러스터에서 확인한 값: kubectl -n kube-system get svc kube-dns  ->  10.96.0.10  (다르게 나오면 이 값을 바꾼다)
    resolver 10.96.0.10 valid=10s ipv6=off;

    # ★ 라우팅 표: 요청 경로($uri)가 왼쪽 패턴에 맞으면 오른쪽 서비스로 보낸다. (next.config.ts rewrites 와 같은 규칙)
    #   - 이름은 Service 이름 + 네임스페이스(his) 까지 쓴다. (Nginx 의 resolver 는 짧은 이름 "billing" 을 못 찾는다)
    #   - 주소 끝에 "/" 를 붙이지 않는다. 붙이면 요청 경로가 바뀐다.
    #   - 위에서부터 먼저 맞는 것이 적용된다. 아무 데도 안 맞으면 default (admin) — Next 의 마지막 규칙 /api/:path* 와 같다.
    map $uri $api_upstream {
        default                     http://admin.his.svc.cluster.local:9191;
        ~^/api/outpatient(/|$)      http://outpatient.his.svc.cluster.local:8088;
        ~^/api/emergency(/|$)       http://emergency.his.svc.cluster.local:8089;
        ~^/api/patient(/|$)         http://patient.his.svc.cluster.local:8087;
        ~^/api/lab-imaging(/|$)     http://labimaging.his.svc.cluster.local:8085;
        ~^/api/surgery(/|$)         http://surgery.his.svc.cluster.local:8084;
        ~^/api/billing(/|$)         http://billing.his.svc.cluster.local:8081;
        ~^/api/reception(/|$)       http://reception.his.svc.cluster.local:8083;
        ~^/api/inpatient(/|$)       http://inpatient.his.svc.cluster.local:8086;
        ~^/api/pharmacy(/|$)        http://pharmacy.his.svc.cluster.local:8082;
    }

    log_format his '$remote_addr "$request" status=$status time=${request_time}s upstream=$upstream_addr';

    # 압축: 텍스트 계열 응답만. (Next 는 자기 응답을 이미 압축해서 보내므로 그건 건드리지 않는다)
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml;

    server_tokens off;
    server {
        listen 8080;
        server_name _;
        access_log /var/log/nginx/access.log his;

        # 업로드 한도. 백엔드(Spring 기본 파일 1MB / 요청 10MB)의 한도와 둘 중 작은 쪽이 적용된다.
        client_max_body_size 20m;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # --- API: 위의 map 표로 서비스를 고른다 ---
        location /api/ {
            proxy_pass $api_upstream;                 # 주소에 경로가 없으므로 요청 경로가 그대로 전달된다
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header Origin            "";     # 백엔드로 Origin 을 보내지 않음 -> CORS 검사 자체가 일어나지 않음
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }

        # --- 직원 프로필 사진 등 파일: /files/emp-photo/a.jpg -> 터미널 SeaweedFS 의 /emp-photo/a.jpg ---
        # 직원 사진 저장소를 터미널 SeaweedFS 하나로 통일했다. (admin 의 SEAWEED_ENDPOINT 와 같은 주소)
        location /files/ {
            set $seaweed http://192.168.49.1:18891;
            rewrite ^/files/(.*)$ /$1 break;          # 앞의 /files 를 떼고
            proxy_pass $seaweed;                      # 터미널 SeaweedFS S3 로 보낸다
            proxy_http_version 1.1;
            proxy_set_header Host 192.168.49.1:18891; # 이 주소로 직접 요청했을 때 동작을 확인한 Host 값
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }

        # --- 나머지(화면 HTML, /_next/static 등)는 Next ---
        location / {
            set $front http://hisfrontend-nginx.his.svc.cluster.local:3000;   # rewrites 없는 새 프론트(hisfrontend-nginx)
            proxy_pass $front;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }
    }

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  namespace: his
  labels:
    app: billing
spec:
  replicas: 1                         # billing Pod 1개 실행
  selector:
    matchLabels:
      app: billing

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0               # 교체 중 기존 Pod 유지
      maxSurge: 1                     # 새 Pod 1개 추가 허용

  template:
    metadata:
      labels:
        app: billing
    spec:
      enableServiceLinks: false

      # admin이 실행된 다음 billing 시작
      initContainers:
        - name: wait-for-admin
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "waiting for admin:9191 ..."
              until nc -z admin 9191; do sleep 3; done
              echo "admin is up"

      containers:
        - name: billing
          image: __IMAGE__            # Jenkins가 빌드한 이미지로 치환
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8081

          # 공통 설정 → billing 설정 → 비밀 설정
          envFrom:
            - configMapRef:
                name: his-common-config
            - configMapRef:
                name: billing-config
            - secretRef:
                name: billing-secret

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi

          # 시작 시 최대 약 5분 동안 기동 확인
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60

          # 요청을 받을 준비가 됐는지 확인
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3

          # 실행 중 포트 응답 확인
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3

---

apiVersion: v1
kind: Service
metadata:
  name: billing
  namespace: his
spec:
  type: ClusterIP
  selector:
    app: billing
  ports:
    - name: http
      port: 8081
      targetPort: http