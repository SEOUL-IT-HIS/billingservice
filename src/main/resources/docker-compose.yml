# ============================================================
# HIS 공용 인프라 compose  (2026-09-18 - 앱 서비스는 컴포즈에서 제거)
# ============================================================
#
# 팀 전체가 admin/billing/pharmacy/reception/surgery/labimaging/inpatient/
# patient/outpatient/emergency/hisfront 10+1개 서비스를 전부 같은 물리서버
# (117.16.154.233)에서 `java -jar`(프론트는 별도 방식)로 직접 띄우는 방식으로
# 통일했기 때문에, 이 컴포즈 파일에는 더 이상 앱 서비스를 넣지 않는다.
# 여기서는 여러 서비스가 공용으로 쓰는 인프라(redis, seaweedfs, kafka)만 관리한다.
#
# 호스트에서 직접 뜨는 앱들은 인프라에 전부 localhost 주소로 접속한다.
#   redis      : localhost:6379
#   seaweedfs  : http://localhost:8333 (S3) / http://localhost:8888 (Filer)
#   kafka      : localhost:9092 (INTERNAL) — 서버 밖에서 접속해야 하면 9094(EXTERNAL)
#
# [실행 전 준비]
#   이 파일 옆에 .env 파일을 만들고 한 줄 적는다. (.env 는 git 에 올리지 않는다)
#     REDIS_PASSWORD=팀공용값
#
# [실행]
#   docker compose up -d          # 인프라(redis, seaweedfs, kafka)만 뜬다
#   이후 각 서비스는 서버에서 java -jar 로 직접 실행한다.
#
# [금지]
#   docker compose down -v / docker volume rm  →  seaweed_data 볼륨의 직원 사진이 지워진다
# ============================================================

services:

  redis: # 로그인 세션 저장소 (admin, patient)
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  seaweedfs: # 파일 저장소 — admin 은 S3(8333), labimaging 은 Filer(8888)
    image: chrislusf/seaweedfs:latest
    command: ["mini", "-dir=/data"]
    ports:
      - "9333:9333"     # master
      - "8888:8888"     # filer
      - "8333:8333"     # S3 — 브라우저가 직원 사진을 직접 받는다
      - "23646:23646"   # 관리 화면
    volumes:
      - seaweed_data:/data

  kafka: # KRaft 단일 노드
    # 앱 서비스가 전부 이 서버에서 java -jar로 직접 뜨기 때문에(도커 네트워크 없음),
    # INTERNAL 리스너의 광고 주소도 localhost로 맞춘다.
    # 같은 서버 안 프로세스는 전부 localhost:9092(INTERNAL)로 접속. EXTERNAL(9094)은
    # 이 서버 밖에서 접속해야 하는 경우에만 쓴다.
    image: apache/kafka:latest
    ports:
      - "9092:9092"
      - "9094:9094"   # 서버 밖에서 접속해야 하는 경우에만 사용
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://localhost:9092,EXTERNAL://117.16.154.233:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  redis_data:
  kafka_data:
  seaweed_data:
    external: true   # 기존 볼륨(직원 사진)을 그대로 쓴다
