apiVersion: v1                          # 사용할 쿠버네티스 API 버전
kind: ConfigMap                        # 설정값을 보관하는 객체
metadata:
  name: billing-config                 # 이 ConfigMap의 이름
  namespace: his                       # 이 객체가 속하는 작업 구역
data:                                  # 컨테이너에 전달할 설정값
  SPRING_DATASOURCE_USERNAME: "billing" # DB 접속 사용자명
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3" # DB 연결 최대 3개
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"      # 대기용 DB 연결 최소 1개 유지 목표

  # 브라우저 요청을 허용할 출처 목록
  APP_CORS_ALLOWED_ORIGIN_PATTERNS: "http://localhost:3000
                                   ,http://seoulit.pe.kr:18080
                                   ,http://seoulit.pe.kr:18090
                                   ,http://117.16.154.233:18080
                                   ,http://117.16.154.233:18090"

  KAKAOPAY_APPROVAL_URL: "http://seoulit.pe.kr:18090/billing/payment/kakaopay/return" # 결제 승인 진행을 위해 돌아올 주소
  KAKAOPAY_CANCEL_URL: "http://seoulit.pe.kr:18090/billing/payment/kakaopay/cancel"   # 결제 취소 시 돌아올 주소
  KAKAOPAY_FAIL_URL: "http://seoulit.pe.kr:18090/billing/payment/kakaopay/fail"       # 결제 실패 시 돌아올 주소

---                                    # 다른 쿠버네티스 객체와 구분

apiVersion: apps/v1                    # Deployment가 사용하는 API 버전
kind: Deployment                       # Pod 실행 개수와 버전 교체를 관리
metadata:
  name: billing                        # Deployment 이름
  namespace: his                       # 이 객체가 속하는 작업 구역
  labels:
    app: billing                       # Deployment 자체에 붙이는 이름표
spec:                                  # 원하는 실행 상태
  replicas: 1                          # 평소 유지할 Pod 개수
  selector:
    matchLabels:
      app: billing                     # 이 이름표가 붙은 Pod를 관리
  strategy:
    type: RollingUpdate                # 새 Pod를 띄우면서 기존 Pod를 교체
    rollingUpdate:
      maxUnavailable: 0                # 교체 중 준비된 Pod 수가 줄지 않게 설정
      maxSurge: 1                      # 교체 중 Pod를 1개 추가로 실행 가능
  template:                            # 새로 만들 Pod의 설계
    metadata:
      labels:
        app: billing                   # Pod에 붙일 이름표(selector와 연결)
    spec:
      enableServiceLinks: false        # Service 관련 환경변수 자동 주입 끄기

      initContainers:                  # 본 컨테이너 실행 전에 먼저 수행
        - name: wait-for-admin         # 사전 작업용 컨테이너 이름
          image: busybox:1.36          # 간단한 명령 실행용 이미지
          command:                     # 이 컨테이너에서 실행할 명령
            - sh                       # 셸 실행
            - -c                       # 아래 문자열을 셸 명령으로 실행
            - |
              echo "waiting for admin:9191 ..."
              until nc -z admin 9191; do sleep 3; done
              # admin의 9191번 포트에 연결될 때까지 3초마다 재시도
              echo "admin is up"

      containers:                      # 실제 애플리케이션 컨테이너
        - name: billing                # 컨테이너 이름
          image: whatyourname22/his-billing:v2.2 # 실행할 이미지와 버전
          imagePullPolicy: IfNotPresent # 서버에 이미지가 없으면 다운로드
          ports:
            - name: http               # 이 포트의 별명
              containerPort: 8081      # 앱이 사용하는 포트 표시(server.port는 별도 설정)

          envFrom:                     # 아래 객체의 값을 환경변수로 전달
            - configMapRef:
                name: his-common-config # 공통 설정 가져오기
            - configMapRef:
                name: billing-config   # billing 설정 가져오기
            - secretRef:
                name: billing-secret   # 비밀번호 등 별도 설정 가져오기

          resources:                   # 컨테이너의 CPU·메모리 설정
            requests:                  # 서버 배치와 자원 배분에 사용할 기준
              cpu: 250m                # CPU 0.25코어 요청
              memory: 512Mi            # 메모리 512MiB 요청
            limits:
              memory: 1Gi              # 메모리 사용 한도 1GiB

          startupProbe:                # 앱이 처음 기동됐는지 확인
            tcpSocket:
              port: http               # 위에서 이름 붙인 8081번 포트 검사
            periodSeconds: 5           # 5초 간격으로 검사
            failureThreshold: 60       # 연속 60회 실패하면 재시작

          readinessProbe:              # 요청을 받을 준비가 됐는지 확인
            tcpSocket:
              port: http               # 8081번 포트 연결 확인
            periodSeconds: 10          # 10초 간격으로 검사
            failureThreshold: 3        # 연속 3회 실패하면 요청 전달 대상에서 제외

          livenessProbe:               # 앱이 계속 살아 있는지 확인
            tcpSocket:
              port: http               # 8081번 포트 연결 확인
            periodSeconds: 20          # 20초 간격으로 검사
            failureThreshold: 3        # 연속 3회 실패하면 컨테이너 재시작

---

apiVersion: v1                         # Service가 사용하는 API 버전
kind: Service                          # 요청을 Pod로 연결하는 고정 접점
metadata:
  name: billing                        # 내부에서 호출할 이름(billing:8081)
  namespace: his                       # 이 객체가 속하는 작업 구역
spec:
  type: ClusterIP                      # 클러스터 내부용 접속 방식
  selector:
    app: billing                       # 이 이름표가 붙은 Pod로 요청 전달
  ports:
    - name: http                       # Service 포트의 이름
      port: 8081                       # Service가 요청을 받는 포트
      targetPort: http                 # Pod의 http 포트(8081)로 전달